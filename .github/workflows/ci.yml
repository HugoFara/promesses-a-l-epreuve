name: contrôles
on: [push, pull_request]
jobs:
  controles:
    runs-on: ubuntu-latest
    env:
      TEST_WEB_STRICT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-web.txt
      - run: playwright install --with-deps chromium
      - run: bash scripts/run_all.sh
      # Site publié : web/ et les CSV publiés de data/ (le site les lit dans ../data/), tels que contrôlés ci-dessus
      - name: Préparer le site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site/data
          cp -r web _site/web
          rm -f _site/web/dashboard_page.html
          cp data/*.csv _site/data/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="fr"><head><meta charset="utf-8"><title>Promesses à l'épreuve</title>
          <meta http-equiv="refresh" content="0; url=web/"><link rel="canonical" href="web/"></head>
          <body><p><a href="web/">Promesses à l'épreuve</a></p></body></html>
          EOF
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploiement:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: controles
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}web/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
